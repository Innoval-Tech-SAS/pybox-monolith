# Real client IP forwarded by the reverse proxy via X-Real-IP header
set_real_ip_from 172.16.0.0/12;
real_ip_header   X-Real-IP;

# Bots de crawling con fines de entrenamiento/indexado de IA que no deben rastrear la app
map $http_user_agent $blocked_bot {
    default 0;
    ~*(GPTBot|ChatGPT-User|CCBot|ClaudeBot|Claude-Web|anthropic-ai|Bytespider|Amazonbot|Google-Extended|PetalBot|Applebot-Extended|Diffbot|MJ12bot|SemrushBot|AhrefsBot) 1;
}

limit_req_zone $binary_remote_addr zone=client_limit:10m rate=10r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    limit_req_status 429;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: GPTBot
Disallow: /

User-agent: ChatGPT-User
Disallow: /

User-agent: CCBot
Disallow: /

User-agent: ClaudeBot
Disallow: /

User-agent: Claude-Web
Disallow: /

User-agent: anthropic-ai
Disallow: /

User-agent: Bytespider
Disallow: /

User-agent: *
Disallow: /admin/
";
    }

    # SPA: todas las rutas van al index.html. Rate-limit solo aqui (proteccion
    # anti-bot/DoS del documento HTML) y no en los assets: con code-splitting una
    # sola navegacion dispara decenas de requests paralelos de chunks .js/.css, y
    # aplicar el mismo limite ahi devolvia 429 en cargas legitimas.
    location / {
        if ($blocked_bot) {
            return 403;
        }
        limit_req zone=client_limit burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Assets inmutables (Vite genera hashes en los nombres) — sin rate-limit, son
    # archivos con hash de contenido, cacheables y seguros de servir en rafaga.
    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg)$ {
        if ($blocked_bot) {
            return 403;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
