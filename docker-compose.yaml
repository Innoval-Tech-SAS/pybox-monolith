services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: template-api
    environment:
      ENV: ${ENV}
      UPLOADS_DIR: ${UPLOADS_DIR}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ENGINE: ${DB_ENGINE}
      DB_DRIVER: ${DB_DRIVER}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      ENCRYPT_KEY: ${ENCRYPT_KEY}
      DOCUMENT_HASH_KEY: ${DOCUMENT_HASH_KEY}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CORS_ORIGINS: ${CORS_ORIGINS}
      NRS360_SMS_TOKEN: ${NRS360_SMS_TOKEN}
      NRS360_EMAIL_TOKEN: ${NRS360_EMAIL_TOKEN}
      SEED_ADMIN_FIRSTNAME: ${SEED_ADMIN_FIRSTNAME}
      SEED_ADMIN_LASTNAME: ${SEED_ADMIN_LASTNAME}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE}
      SEED_ADMIN_NATIONALITY: ${SEED_ADMIN_NATIONALITY}
      SEED_ADMIN_DOC_TYPE: ${SEED_ADMIN_DOC_TYPE}
      SEED_ADMIN_DOC_NUMBER: ${SEED_ADMIN_DOC_NUMBER}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: template-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: template-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
