services:
  database:
    image: docker.io/library/postgres:17-alpine
    container_name: pybox-database
    command: ["postgres", "-c", "timezone=America/Bogota"]
    environment:
      TZ: America/Bogota
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: pybox-redis
    environment:
      TZ: America/Bogota
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgbouncer:
    image: docker.io/edoburu/pgbouncer:latest
    container_name: pybox-pgbouncer
    environment:
      TZ: America/Bogota
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 2
      SERVER_IDLE_TIMEOUT: 600
      AUTH_TYPE: scram-sha-256
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage:
    image: docker.io/chrislusf/seaweedfs:latest
    container_name: pybox-storage
    environment:
      TZ: America/Bogota
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<EOF
        {
          "identities": [
            {
              "name": "api",
              "credentials": [
                { "accessKey": "$${STORAGE_ACCESS_KEY}", "secretKey": "$${STORAGE_SECRET_KEY}" }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF
        exec weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    # Sin ports: el gateway S3 no se publica en ningun puerto del host. Solo lo alcanza
    # la API por la red interna del compose, asi que no existe forma de llegar a un
    # archivo sin pasar por la autorizacion de FastAPI.
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: pybox-pgadmin
    environment:
      TZ: America/Bogota
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pybox-api
    environment:
      TZ: America/Bogota
      ENV: ${ENV}
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      DB_HOST: pgbouncer
      DB_PORT: ${DB_PORT}
      # Alembic (`compose exec api alembic ...`) esquiva pgbouncer y habla con Postgres
      # directo: en modo `transaction` el pooler rompe CREATE INDEX CONCURRENTLY y los
      # autocommit_block() de las migraciones. Solo las migraciones usan esto; la app
      # sigue saliendo por DB_HOST/DB_PORT.
      ALEMBIC_DB_HOST: database
      ALEMBIC_DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ENGINE: ${DB_ENGINE}
      DB_DRIVER: ${DB_DRIVER}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      ENCRYPT_KEY: ${ENCRYPT_KEY}
      DOCUMENT_HASH_KEY: ${DOCUMENT_HASH_KEY}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      NRS360_SMS_TOKEN: ${NRS360_SMS_TOKEN}
      NRS360_SMS_SENDER: ${NRS360_SMS_SENDER}
      NRS360_EMAIL_TOKEN: ${NRS360_EMAIL_TOKEN}
      NRS360_EMAIL_SENDER: ${NRS360_EMAIL_SENDER}
      NRS360_EMAIL_SENDER_NAME: ${NRS360_EMAIL_SENDER_NAME}
      WHATSAPP_CLOUD_ACCESS_TOKEN: ${WHATSAPP_CLOUD_ACCESS_TOKEN}
      WHATSAPP_CLOUD_WABA_ID: ${WHATSAPP_CLOUD_WABA_ID}
      WHATSAPP_CLOUD_APP_SECRET: ${WHATSAPP_CLOUD_APP_SECRET}
      WHATSAPP_CLOUD_VERIFY_TOKEN: ${WHATSAPP_CLOUD_VERIFY_TOKEN}
      BILLING_TAX_ENABLED: ${BILLING_TAX_ENABLED}
      BILLING_TAX_TYPE: ${BILLING_TAX_TYPE}
      BILLING_TAX_RATE: ${BILLING_TAX_RATE}
      BILLING_PAYMENT_DUE_DAYS: ${BILLING_PAYMENT_DUE_DAYS}
      BILLING_BLOCK_AFTER_DAYS: ${BILLING_BLOCK_AFTER_DAYS}
      BILLING_BLOCKING_ENABLED: ${BILLING_BLOCKING_ENABLED}
      SEED_ADMIN_FIRSTNAME: ${SEED_ADMIN_FIRSTNAME}
      SEED_ADMIN_LASTNAME: ${SEED_ADMIN_LASTNAME}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE}
      SEED_ADMIN_NATIONALITY: ${SEED_ADMIN_NATIONALITY}
      SEED_ADMIN_DOC_TYPE: ${SEED_ADMIN_DOC_TYPE}
      SEED_ADMIN_DOC_NUMBER: ${SEED_ADMIN_DOC_NUMBER}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MP_PUBLIC_KEY_MX: ${MP_PUBLIC_KEY_MX}
      MP_ACCESS_TOKEN_MX: ${MP_ACCESS_TOKEN_MX}
      MP_WEBHOOK_SECRET_MX: ${MP_WEBHOOK_SECRET_MX}
      MP_APPLICATION_ID_MX: ${MP_APPLICATION_ID_MX}
      BOLD_API_KEY: ${BOLD_API_KEY}
      BOLD_SECRET_KEY: ${BOLD_SECRET_KEY}
      BOLD_REDIRECTION_URL: ${BOLD_REDIRECTION_URL}
      HELENA_BASE_URL: ${HELENA_BASE_URL}
      HELENA_API_TOKEN: ${HELENA_API_TOKEN}
      HELENA_WEBHOOK_SECRET: ${HELENA_WEBHOOK_SECRET}
      HELENA_PUBLIC_WEBHOOK_URL: ${HELENA_PUBLIC_WEBHOOK_URL}
      HELENA_TIMEOUT_SECONDS: ${HELENA_TIMEOUT_SECONDS}
      HELENA_TIMEZONE: ${HELENA_TIMEZONE}
      IVR_STALE_MINUTES: ${IVR_STALE_MINUTES}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
      pgadmin:
        condition: service_started
    volumes:
      - api_logs:/app/logs
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pybox-client
    environment:
      TZ: America/Bogota
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: pybox-landing
    environment:
      TZ: America/Bogota
      LANDING_SIGN_IN_URL: ${LANDING_SIGN_IN_URL}
      LANDING_SIGN_UP_URL: ${LANDING_SIGN_UP_URL}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      client:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
  pgadmin_data:
  api_logs:
